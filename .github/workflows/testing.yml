name: Testing

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      JWT_SECRET: ci-test-secret
      ALLOWED_EMAIL_DOMAINS: etec.um.edu.ar,um.edu.ar,alumno.etec.um.edu.ar
      ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-test-client
      GOOGLE_CLIENT_SECRET: ci-test-secret
      BLOB_READ_WRITE_TOKEN: ci-test-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify integration database secret
        env:
          TEST_DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::El secreto DATABASE_URL_TEST no está configurado"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
