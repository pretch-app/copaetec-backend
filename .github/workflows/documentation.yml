name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: Generate and validate OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI JSON
        run: npm run docs:generate

      - name: Validate OpenAPI
        run: npm run docs:validate

      - name: Check generated file is synchronized
        run: git diff --exit-code -- docs/openapi.json

      - name: Upload generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: openapi-documentation
          path: docs/openapi.json
          if-no-files-found: error

  publish:
    name: Publish Swagger UI to GitHub Pages
    # Solo al mergear a main: los PRs validan la documentación pero no la publican.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: openapi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p site
          cp docs/swagger/index.html site/index.html
          cp docs/openapi.json site/openapi.json
          cp docs/openapi.yaml site/openapi.yaml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
